  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

lor:var(--accent);letter-spacing:.4px;\">HEATING &amp; HOT WATER · STEP 2 OF 2<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:22px;font-weight:800;letter-spacing:-.3px;margin:12px 0 4px;\">Describe it briefly<\u002Fdiv>\n              <div style=\"font-size:14px;color:var(--muted);line-height:1.5;\">A sentence is plenty. Knox will take it from here.<\u002Fdiv>\n              <div style=\"margin-top:16px;border:1px solid var(--line);border-radius:16px;background:#fff;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.03);\">\n                <input value=\"{{ desc }}\" onchange=\"{{ onDesc }}\" onkeydown=\"{{ onDescKey }}\" placeholder=\"e.g. No hot water from any tap since this morning\" style=\"width:100%;border:none;outline:none;font-size:15.5px;line-height:1.5;color:var(--ink);\">\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;\">\n                <button onclick=\"{{ fillDesc }}\" style=\"padding:8px 13px;border-radius:20px;border:1px solid var(--line);background:var(--paper);font-size:12.5px;font-weight:700;color:#4a5563;cursor:pointer;\">No hot water at all<\u002Fbutton>\n                <button onclick=\"{{ fillDesc2 }}\" style=\"padding:8px 13px;border-radius:20px;border:1px solid var(--line);background:var(--paper);font-size:12.5px;font-weight:700;color:#4a5563;cursor:pointer;\">Radiators cold too<\u002Fbutton>\n              <\u002Fdiv>\n              <button onclick=\"{{ submitDescribe }}\" style=\"width:100%;margin-top:20px;padding:15px 0;border-radius:15px;border:none;background:var(--accent);color:#fff;font-size:16px;font-weight:800;cursor:pointer;\">Get help from Knox<\u002Fbutton>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- ---------- DIAGNOSIS ---------- -->\n            <sc-if value=\"{{ tDiagnosis }}\">\n            <div style=\"padding:6px 20px 26px;\">\n              <sc-if value=\"{{ analysing }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display:flex;flex-direction:column;align-items:center;justify-content:center;height:520px;animation:knoxfade .3s ease;\">\n                <div style=\"width:52px;height:52px;border-radius:50%;border:4px solid #e7eaef;border-top-color:var(--accent);animation:knoxspin .8s linear infinite;\"><\u002Fdiv>\n                <div style=\"font-size:16px;font-weight:800;margin-top:20px;\">Knox is having a look…<\u002Fdiv>\n                <div style=\"font-size:13.5px;color:var(--muted);margin-top:5px;\">Matching your boiler and symptoms<\u002Fdiv>\n              <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ diagnosed }}\">\n              <div style=\"animation:knoxrise .3s ease both;padding-top:8px;\">\n                <div style=\"display:inline-flex;align-items:center;gap:7px;background:#eaf0f7;border-radius:20px;padding:6px 12px;\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\"><path d=\"M12 2.4 4.5 5.2v6.1c0 4.7 3.2 8.1 7.5 9.4 4.3-1.3 7.5-4.7 7.5-9.4V5.2L12 2.4Z\" fill=\"var(--accent)\"><\u002Fpath><\u002Fsvg><span style=\"font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.3px;\">KNOX DIAGNOSIS<\u002Fspan><\u002Fdiv>\n                <div style=\"font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.4px;margin-top:16px;\">MOST LIKELY CAUSE<\u002Fdiv>\n                <div style=\"font-size:25px;font-weight:800;letter-spacing:-.5px;line-height:1.1;margin-top:3px;\">Low boiler pressure<\u002Fdiv>\n                <div style=\"font-size:14.5px;color:#43505f;line-height:1.55;margin-top:9px;\">When the pressure drops too low, your boiler shuts off the hot water to protect itself. It's very common — especially after cold snaps — and usually a two-minute fix you can safely do yourself.<\u002Fdiv>\n\n                <div style=\"display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-top:16px;\">\n                  <span style=\"width:44px;height:44px;border-radius:11px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 30 30\"><rect x=\"4\" y=\"3\" width=\"22\" height=\"24\" rx=\"3\" fill=\"none\" stroke=\"#5b6472\" stroke-width=\"1.6\"><\u002Frect><rect x=\"8\" y=\"7\" width=\"14\" height=\"7\" rx=\"1.5\" fill=\"#dfe3e9\"><\u002Frect><circle cx=\"11\" cy=\"20\" r=\"2\" fill=\"none\" stroke=\"#5b6472\" stroke-width=\"1.4\"><\u002Fcircle><path d=\"M17 18v4M20 18v4\" stroke=\"#5b6472\" stroke-width=\"1.4\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n                  <div><div style=\"font-size:15px;font-weight:800;\">Ideal Logic Plus 30<\u002Fdiv><div style=\"font-size:12.5px;color:var(--muted);\">Your boiler · in the airing cupboard<\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n\n                <div style=\"margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 3px 12px rgba(0,0,0,.05);\">\n                  <div style=\"padding:15px 16px 4px;\"><div style=\"font-size:16px;font-weight:800;\">Want to try the quick fix?<\u002Fdiv><div style=\"font-size:13.5px;color:var(--muted);margin-top:2px;\">3 short steps · about 2 minutes · no cost to you<\u002Fdiv><\u002Fdiv>\n                  <div style=\"display:flex;gap:11px;padding:14px 16px 16px;\">\n                    <button onclick=\"{{ startFix }}\" style=\"flex:1;padding:14px 0;border-radius:13px;border:none;background:var(--accent);color:#fff;font-size:15.5px;font-weight:800;cursor:pointer;\">Yes, walk me through it<\u002Fbutton>\n                  <\u002Fdiv>\n                  <button onclick=\"{{ fixFailed }}\" style=\"width:100%;padding:0 0 15px;border:none;background:transparent;color:var(--muted);font-size:13.5px;font-weight:700;cursor:pointer;\">I'd rather someone came out<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- ---------- GUIDED FIX ---------- -->\n            <sc-if value=\"{{ tFix }}\">\n            <div style=\"padding:6px 20px 26px;animation:knoxrise .28s ease both;\">\n              <div style=\"display:flex;align-items:center;gap:12px;padding:8px 0 12px;\">\n                <button onclick=\"{{ backToDiagnosis }}\" style=\"width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;\"><svg width=\"9\" height=\"16\" viewBox=\"0 0 10 18\"><path d=\"M8.5 1.5 1.5 9l7 7.5\" fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n                <div style=\"flex:1;\"><div style=\"font-size:17px;font-weight:800;\">Repressurise your boiler<\u002Fdiv><\u002Fdiv>\n                <span style=\"font-size:13px;font-weight:800;color:var(--muted);\">{{ fixStep }}/3<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:6px;margin-bottom:16px;\">\n                <div style=\"flex:1;height:5px;border-radius:3px;background: {{ seg1 }};transition:background .3s;\"><\u002Fdiv>\n                <div style=\"flex:1;height:5px;border-radius:3px;background: {{ seg2 }};transition:background .3s;\"><\u002Fdiv>\n                <div style=\"flex:1;height:5px;border-radius:3px;background: {{ seg3 }};transition:background .3s;\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"position:relative;border-radius:18px;overflow:hidden;height:200px;background:#1b2836;\">\n                <img src=\"09acd745-89c7-4ba6-b91d-c866b051b9c4\" style=\"width:100%;height:100%;object-fit:cover;opacity:.85;display:block;\" alt=\"Boiler filling loop\">\n                <div style=\"position:absolute;inset:0;background:linear-gradient(to top,rgba(13,18,25,.7),rgba(13,18,25,0) 55%);\"><\u002Fdiv>\n                <div style=\"position:absolute;top:11px;left:12px;background:rgba(13,18,25,.65);color:#fff;font-size:11px;font-weight:700;padding:5px 10px;border-radius:20px;display:flex;align-items:center;gap:6px;\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 18 18\"><path d=\"M4 3 15 9 4 15Z\" fill=\"#fff\"><\u002Fpath><\u002Fsvg>Watch the 45-second clip<\u002Fdiv>\n                <div style=\"position:absolute;bottom:12px;left:14px;right:14px;color:#fff;font-size:12.5px;font-weight:600;\">The filling loop sits underneath the boiler<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"margin-top:16px;display:flex;gap:12px;align-items:flex-start;\">\n                <span style=\"width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;\">{{ fixStep }}<\u002Fspan>\n                <div style=\"flex:1;min-height:78px;\">\n                  <sc-if value=\"{{ fs1 }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-size:16px;line-height:1.5;color:var(--ink);\">Find the <b>filling loop<\u002Fb> beneath the boiler — two small black levers joined by a silver braided hose.<\u002Fdiv><\u002Fsc-if>\n                  <sc-if value=\"{{ fs2 }}\"><div style=\"font-size:16px;line-height:1.5;color:var(--ink);\">Open <b>both levers<\u002Fb> slowly. You'll hear water flowing — watch the gauge climb and close them again at about <b>1.5 bar<\u002Fb>.<\u002Fdiv><\u002Fsc-if>\n                  <sc-if value=\"{{ fs3 }}\"><div style=\"font-size:16px;line-height:1.5;color:var(--ink);\">Press the <b>reset button<\u002Fb>, wait two minutes for it to fire up, then run a hot tap to check.<\u002Fdiv><\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:9px;margin-top:14px;\">\n                <sc-if value=\"{{ fixBackShow }}\"><button onclick=\"{{ fixPrev }}\" style=\"padding:14px 18px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:#4a5563;font-size:15px;font-weight:800;cursor:pointer;\">Back<\u002Fbutton><\u002Fsc-if>\n                <sc-if value=\"{{ fixNextShow }}\"><button onclick=\"{{ fixNext }}\" style=\"flex:1;padding:15px 0;border-radius:14px;border:none;background:var(--accent);color:#fff;font-size:15.5px;font-weight:800;cursor:pointer;\">Done — next step<\u002Fbutton><\u002Fsc-if>\n                <sc-if value=\"{{ fixDoneShow }}\"><button onclick=\"{{ fixWorked }}\" style=\"flex:1;padding:15px 0;border-radius:14px;border:none;background:var(--green);color:#fff;font-size:15.5px;font-weight:800;cursor:pointer;\">The hot water's back<\u002Fbutton><\u002Fsc-if>\n              <\u002Fdiv>\n              <button onclick=\"{{ fixFailed }}\" style=\"width:100%;margin-top:11px;padding:10px 0;border:none;background:transparent;color:var(--muted);font-size:13.5px;font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:2px;\">This didn't work<\u002Fbutton>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- ---------- RESOLVED (verdict + handover) ---------- -->\n            <sc-if value=\"{{ tResolved }}\">\n            <div style=\"padding:6px 0 26px;animation:knoxrise .3s ease both;\">\n              <div style=\"text-align:center;padding:22px 24px 4px;\">\n                <div style=\"width:66px;height:66px;border-radius:50%;background:#e7f0ea;display:flex;align-items:center;justify-content:center;margin:0 auto;\"><svg width=\"34\" height=\"28\" viewBox=\"0 0 20 17\"><path d=\"M2 9 7 14 18 2\" fill=\"none\" stroke=\"var(--green)\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n                <div style=\"font-size:23px;font-weight:800;letter-spacing:-.4px;margin-top:14px;\">Sorted — hot water's back<\u002Fdiv>\n                <div style=\"font-size:14px;color:var(--muted);line-height:1.5;margin-top:6px;\">You fixed this yourself in under two minutes. Here's the record, and what it means for you.<\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"padding:16px 20px 0;\">\n                <!-- responsibility verdict -->\n                <div style=\"background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;box-shadow:0 2px 8px rgba(0,0,0,.04);\">\n                  <div style=\"display:flex;align-items:center;gap:8px;\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\"><path d=\"M12 2.4 4.5 5.2v6.1c0 4.7 3.2 8.1 7.5 9.4 4.3-1.3 7.5-4.7 7.5-9.4V5.2L12 2.4Z\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"1.7\"><\u002Fpath><\u002Fsvg><span style=\"font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.4px;\">WHOSE RESPONSIBILITY<\u002Fspan><\u002Fdiv>\n                  <div style=\"font-size:16px;font-weight:800;margin-top:9px;line-height:1.35;\">The boiler is your landlord's responsibility — so you're covered.<\u002Fdiv>\n                  <div style=\"font-size:13.5px;color:#43505f;line-height:1.55;margin-top:7px;\">Topping up the pressure is a normal bit of tenant upkeep, like resetting a tripped switch. But the boiler itself is maintained by your landlord under <b>Section 11 of the Landlord &amp; Tenant Act 1985<\u002Fb>, so if it keeps happening, any repair is at no cost to you.<\u002Fdiv>\n                <\u002Fdiv>\n\n                <!-- handover -->\n                <div style=\"background:#fff;border:1px solid var(--line);border-radius:16px;margin-top:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.04);\">\n                  <div style=\"display:flex;align-items:center;justify-content:space-between;padding:13px 15px;border-bottom:1px solid var(--line);\">\n                    <div><div style=\"font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.4px;\">REFERENCE<\u002Fdiv><div style=\"font-size:17px;font-weight:800;letter-spacing:.3px;\">KX-4471<\u002Fdiv><\u002Fdiv>\n
